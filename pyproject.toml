# Drone Watch: один пакет dronewatch у src-layout (src/dronewatch/{fusion,service,emulator}).
#
# Розробка:   pip install -e ".[dev]"    потім    pytest        (потрібне встановлення: пакет не береться з поточної теки)
# Запуск:     python -m dronewatch.service.serve   |   dronewatch-serve   (точки входу: див. [project.scripts])

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dronewatch"
version = "0.1.0"
description = "Drone Watch: мультидатчикове виявлення дронів (fusion-трекер, сервіс, емулятор датчиків)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "websockets>=12",
    "numpy>=1.26",
    "pyyaml>=6",
    "scipy>=1.11",
    "paho-mqtt>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=9.2.0", "httpx>=0.27", "cryptography>=42", "ruff>=0.6", "mypy>=1.10", "types-PyYAML"]
viz = ["matplotlib>=3.8"]   # лише для dronewatch.fusion.viz (малює карти треків)

[project.scripts]
dronewatch-serve = "dronewatch.service.serve:main"
dronewatch-keygen = "dronewatch.service.keygen:main"
dronewatch-bench = "dronewatch.service.flood_bench:main"
dronewatch-emulate = "dronewatch.emulator.emulate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"dronewatch.service" = ["static/*", "*.yaml"]   # дашборд і конфіги лежать поруч із кодом і мають їхати разом із пакетом

[tool.pytest.ini_options]
pythonpath = ["tests"]   # тести імпортують одне одного (хелпери); сам пакет береться зі встановлення
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient`:DeprecationWarning",
    "ignore:.*starlette.testclient.*:DeprecationWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 140
src = ["src", "tests"]
extend-exclude = ["**/__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "PTH", "PIE", "RUF", "PT"]
ignore = [
    "RUF001", "RUF002", "RUF003",   # «двозначні» символи: хибні спрацювання на українських коментарях і рядках
    "E402",                          # імпорти не нагорі: тести навмисно імпортують після налаштування середовища
    "B905",                          # zip() без strict: розглядається окремо там, де довжини справді мають збігатися
    "PT011", "PT018",                # занадто широкі правила для стилю цих тестів
]

[tool.ruff.lint.isort]
known-first-party = ["dronewatch"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501", "SIM117"]

[tool.mypy]
files = ["src"]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
