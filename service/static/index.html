<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drone Watch</title>
<style>
  :root {
    --bg: #0b1117; --panel: #111a23; --line: #1f2d3a; --text: #d7e2ea; --muted: #7d92a3;
    --ok: #3fb5a3; --warn: #f2a93b; --crit: #ef4b5b; --sensor: #6aa7ff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, "Segoe UI", sans-serif;
         height: 100vh; display: grid; grid-template-rows: auto 1fr; overflow: hidden; }
  header { display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: center; padding: 10px 16px;
           border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 16px; margin: 0; letter-spacing: .04em; }
  .badge { padding: 2px 10px; border-radius: 999px; font-size: 12px; border: 1px solid var(--line); color: var(--muted); }
  .badge.live { color: var(--ok); border-color: var(--ok); }
  .badge.off { color: var(--crit); border-color: var(--crit); }
  .stat { color: var(--muted); } .stat b { color: var(--text); font-variant-numeric: tabular-nums; }
  .spacer { flex: 1; }
  main { display: grid; grid-template-columns: 1fr 340px; min-height: 0; }
  #mapwrap { position: relative; min-height: 0; }
  canvas { width: 100%; height: 100%; display: block; }
  #legend { position: absolute; left: 12px; bottom: 12px; background: #0b1117cc; border: 1px solid var(--line);
            border-radius: 8px; padding: 8px 12px; font-size: 12px; color: var(--muted); display: grid; gap: 4px; }
  #legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
  #legend label { cursor: pointer; color: var(--text); }
  aside { border-left: 1px solid var(--line); background: var(--panel); display: grid; grid-template-rows: auto 1fr auto auto; min-height: 0; }
  h2 { margin: 0; padding: 10px 16px; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted);
       border-bottom: 1px solid var(--line); }
  #alerts { overflow-y: auto; min-height: 0; }
  .alert { padding: 8px 16px; border-bottom: 1px solid var(--line); display: grid; gap: 2px; }
  .alert .lvl { font-weight: 600; font-size: 12px; letter-spacing: .05em; }
  .alert.CRITICAL .lvl { color: var(--crit); } .alert.WARNING .lvl { color: var(--warn); }
  .alert .meta { color: var(--muted); font-size: 12px; }
  .empty { padding: 16px; color: var(--muted); }
  .sensor { display: flex; align-items: center; gap: 8px; padding: 5px 16px; font-size: 13px; }
  .sensor i { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); flex: none; }
  .sensor.WAITING i { background: var(--warn); } .sensor.LOST i { background: var(--crit); }
  .sensor .st { margin-left: auto; color: var(--muted); font-size: 12px; }
  .sensor.LOST .st { color: var(--crit); font-weight: 600; } .sensor.WAITING .st { color: var(--warn); }
  #degraded { flex: 1 0 100%; background: #ef4b5b22; border: 1px solid var(--crit); border-radius: 6px; color: var(--crit); padding: 6px 12px; font-size: 13px; }
  #tracks { max-height: 38vh; overflow-y: auto; border-top: 1px solid var(--line); }
  table { width: 100%; border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; }
  th, td { padding: 4px 8px; text-align: left; } th { color: var(--muted); font-weight: 500; position: sticky; top: 0; background: var(--panel); }
  tr.sel { background: #1b2a38; } tr { cursor: pointer; }
  td.NONE { color: var(--ok); } td.WARNING { color: var(--warn); } td.CRITICAL { color: var(--crit); }
  #toast { position: absolute; right: 12px; top: 12px; display: grid; gap: 6px; pointer-events: none; }
  .toast { background: #0b1117e6; border: 1px solid var(--crit); color: var(--text); padding: 8px 12px; border-radius: 8px; font-size: 13px; }
  .toast.WARNING { border-color: var(--warn); }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; grid-template-rows: 55vh 1fr; } aside { border-left: 0; border-top: 1px solid var(--line); } }
</style>
</head>
<body>
<header>
  <h1>DRONE WATCH</h1>
  <span id="conn" class="badge off">немає звʼязку</span>
  <span id="mode" class="badge"></span>
  <span id="calib" class="badge"></span>
  <span id="mqtt" class="badge" hidden></span>
  <span id="sens" class="badge"></span>
  <span id="overload" class="badge off" hidden></span>
  <span id="denied" class="badge off" hidden></span>
  <span class="stat">Треків: <b id="s-tracks">0</b></span>
  <span class="stat">Кандидатів: <b id="s-tent">0</b></span>
  <span class="stat">Подій: <b id="s-ev">0</b></span>
  <span class="spacer"></span>
  <span class="stat">t = <b id="s-t">0</b> с</span>
  <div id="degraded" hidden></div>
</header>
<main>
  <div id="mapwrap">
    <canvas id="map"></canvas>
    <div id="toast"></div>
    <div id="legend">
      <div><i style="background:#3fb5a3"></i>трек поза зонами</div>
      <div><i style="background:#f2a93b"></i>у буферній зоні</div>
      <div><i style="background:#ef4b5b"></i>у критичній зоні</div>
      <div><i style="background:#6aa7ff"></i>датчик</div>
      <label id="truth-row" hidden><input type="checkbox" id="truth"> показати істинні позиції (лише демо)</label>
    </div>
  </div>
  <aside>
    <div>
      <h2>Тривоги</h2>
    </div>
    <div id="alerts"><div class="empty">Тривог немає</div></div>
    <div id="sensors-box">
      <h2>Датчики</h2>
      <div id="sensors"></div>
    </div>
    <div>
      <h2>Активні треки</h2>
      <div id="tracks"><table><thead><tr><th>ID</th><th>Рівень</th><th>V, м/с</th><th>H, м</th><th>Датчики</th></tr></thead><tbody id="tbody"></tbody></table></div>
    </div>
  </aside>
</main>
<script>
const COLORS = { NONE: "#3fb5a3", WARNING: "#f2a93b", CRITICAL: "#ef4b5b" };
const LEVEL_UA = { NONE: "—", WARNING: "увага", CRITICAL: "загроза" };
const KIND_UA = { radar: "радар", rf: "RF", acoustic: "акуст." };
const SENSOR_UA = { OK: "справний", WAITING: "очікуємо", LOST: "немає звʼязку" };
const sensorState = id => ((state && state.sensors || []).find(s => s.id === id) || {}).state;
const cv = document.getElementById("map"), ctx = cv.getContext("2d");
let cfg = null, state = null, selected = null, trails = new Map(), seenAlerts = new Set(), view = { s: 0.4 }, firstMsg = true;

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

function resize() {
  const r = cv.getBoundingClientRect(), d = devicePixelRatio || 1;
  cv.width = r.width * d; cv.height = r.height * d; ctx.setTransform(d, 0, 0, d, 0, 0);
  if (cfg) fit();
}
function fit() {
  const r = cv.getBoundingClientRect();
  let ext = 300;
  cfg.sensors.forEach(s => ext = Math.max(ext, Math.hypot(...s.pos)));
  cfg.zones.forEach(z => ext = Math.max(ext, z.radius));
  ext = Math.max(ext * 1.6, 1000);
  view.s = Math.min(r.width, r.height) / 2 / ext;
}
const W = () => cv.getBoundingClientRect().width, H = () => cv.getBoundingClientRect().height;
const px = x => W() / 2 + x * view.s, py = y => H() / 2 - y * view.s;

function draw() {
  ctx.clearRect(0, 0, W(), H());
  if (!cfg) return;
  // сітка кожні 250 м
  ctx.lineWidth = 1; ctx.strokeStyle = "#16222d"; ctx.fillStyle = "#4b6071"; ctx.font = "11px system-ui";
  const step = 250, ex = Math.max(W(), H()) / view.s / 2;
  for (let v = -Math.ceil(ex / step) * step; v <= ex; v += step) {
    ctx.beginPath(); ctx.moveTo(px(v), 0); ctx.lineTo(px(v), H()); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, py(v)); ctx.lineTo(W(), py(v)); ctx.stroke();
    if (v) { ctx.fillText(v + " м", px(v) + 3, py(0) - 4); }
  }
  // зони
  cfg.zones.forEach(z => {
    ctx.beginPath(); ctx.arc(px(z.center[0]), py(z.center[1]), z.radius * view.s, 0, 7);
    const c = COLORS[z.level];
    ctx.fillStyle = c + "14"; ctx.fill(); ctx.strokeStyle = c + "99"; ctx.setLineDash([6, 5]); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = c; ctx.fillText(z.name, px(z.center[0]) + 6, py(z.center[1]) - z.radius * view.s - 5);
  });
  // датчики
  cfg.sensors.forEach(s => {
    const lost = sensorState(s.id) === "LOST";
    ctx.beginPath(); ctx.arc(px(s.pos[0]), py(s.pos[1]), s.max_range * view.s, 0, 7);
    ctx.strokeStyle = lost ? "#ef4b5b55" : "#6aa7ff33"; ctx.setLineDash(lost ? [3, 5] : []); ctx.stroke(); ctx.setLineDash([]);
    const x = px(s.pos[0]), y = py(s.pos[1]);
    ctx.beginPath(); ctx.moveTo(x, y - 8); ctx.lineTo(x + 7, y + 6); ctx.lineTo(x - 7, y + 6); ctx.closePath();
    ctx.fillStyle = lost ? "#ef4b5b" : "#6aa7ff"; ctx.fill();
    ctx.fillStyle = lost ? "#ef4b5b" : "#8fb6ee"; ctx.fillText(s.id + (lost ? " — НЕМАЄ ЗВʼЯЗКУ" : ""), x + 10, y + 4);
  });
  if (!state) return;
  // істина (демо)
  if (document.getElementById("truth").checked && state.truth) {
    ctx.strokeStyle = "#ffffff88"; ctx.lineWidth = 1;
    Object.values(state.truth).forEach(p => { ctx.beginPath(); ctx.arc(px(p[0]), py(p[1]), 7, 0, 7); ctx.stroke(); });
  }
  // треки
  const now = performance.now(), pulse = 0.5 + 0.5 * Math.sin(now / 180);
  state.tracks.forEach(t => {
    const c = COLORS[t.level], tr = trails.get(t.id) || [];
    ctx.globalAlpha = t.coasting ? 0.35 : 1;
    ctx.beginPath(); tr.forEach((p, i) => i ? ctx.lineTo(px(p[0]), py(p[1])) : ctx.moveTo(px(p[0]), py(p[1])));
    ctx.strokeStyle = c + "88"; ctx.lineWidth = 1.5; ctx.stroke();
    const x = px(t.x), y = py(t.y);
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + t.vx * view.s * 4, y - t.vy * view.s * 4); ctx.strokeStyle = c; ctx.stroke();
    if (t.level === "CRITICAL") { ctx.beginPath(); ctx.arc(x, y, 9 + 5 * pulse, 0, 7); ctx.strokeStyle = c + "99"; ctx.stroke(); }
    ctx.beginPath(); ctx.arc(x, y, 5, 0, 7); ctx.fillStyle = c; ctx.fill();
    if (t.id === selected) { ctx.beginPath(); ctx.arc(x, y, 12, 0, 7); ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.5; ctx.stroke(); }
    ctx.fillStyle = "#d7e2ea"; ctx.fillText("#" + t.id + (t.coasting ? " ?" : ""), x + 9, y - 7);
    ctx.globalAlpha = 1;
  });
}
(function loop() { draw(); requestAnimationFrame(loop); })();

function toast(a) {
  const el = document.createElement("div");
  el.className = "toast " + a.level;
  el.textContent = (a.level === "CRITICAL" ? "ЗАГРОЗА: " : "Увага: ") + "ціль #" + a.track_id + " — " + a.zone;
  document.getElementById("toast").appendChild(el);
  setTimeout(() => el.remove(), 6000);
}

function render(msg) {
  state = msg;
  document.getElementById("s-tracks").textContent = msg.tracks.filter(t => !t.coasting).length;
  document.getElementById("s-tent").textContent = msg.tentative;
  document.getElementById("s-ev").textContent = msg.stats.events_in;
  document.getElementById("s-t").textContent = msg.t.toFixed(0);
  const cal = document.getElementById("calib");
  cal.textContent = msg.calibration.done ? "калібрування: " + msg.calibration.note : "калібрування: не виконано";
  cal.className = "badge " + (msg.calibration.done ? "live" : "off");

  const mq = document.getElementById("mqtt");
  mq.hidden = !msg.mqtt;
  if (msg.mqtt) {
    const idle = msg.mqtt.connected && msg.mqtt.idle_s > 10;   // зʼєднання є, а подій немає: типовий симптом хибної ACL брокера
    mq.textContent = "MQTT " + msg.mqtt.host + (!msg.mqtt.connected ? " — немає звʼязку" : idle ? " — подій немає " + Math.round(msg.mqtt.idle_s) + " с (перевірте ACL)" : "");
    mq.className = "badge " + (msg.mqtt.connected && !idle ? "live" : "off");
  }

  renderSensors(msg.sensors || []);
  const st = msg.stats, ov = document.getElementById("overload"), shed = st.events_dropped + st.tracks_capped + st.bearings_truncated;
  const dn = document.getElementById("denied");
  dn.hidden = !st.events_unauthorized;   // події без ключа: або хибно налаштований датчик, або чужий намагається підкинути дані
  if (st.events_unauthorized) dn.textContent = "без чинного ключа: " + st.events_unauthorized + " подій";
  ov.hidden = !shed;
  if (shed) ov.textContent = "перевантаження: відкинуто " + st.events_dropped + " подій" + (st.tracks_capped ? ", треків " + st.tracks_capped : "");

  const ids = new Set(msg.tracks.map(t => t.id));
  msg.tracks.forEach(t => {
    const tr = trails.get(t.id) || []; tr.push([t.x, t.y]); if (tr.length > 60) tr.shift(); trails.set(t.id, tr);
  });
  [...trails.keys()].forEach(id => { if (!ids.has(id)) trails.delete(id); });

  const rows = msg.tracks.filter(t => !t.coasting).sort((a, b) => ({ CRITICAL: 2, WARNING: 1, NONE: 0 }[b.level] - { CRITICAL: 2, WARNING: 1, NONE: 0 }[a.level]) || a.id - b.id);
  document.getElementById("tbody").innerHTML = rows.map(t =>
    `<tr data-id="${t.id}" class="${t.id === selected ? "sel" : ""}"><td>#${t.id}</td><td class="${t.level}">${LEVEL_UA[t.level]}</td>` +
    `<td>${t.speed}</td><td>${Math.round(t.z)}</td><td>${esc(t.kinds.map(k => KIND_UA[k] || k).join(", "))}</td></tr>`).join("");

  const box = document.getElementById("alerts");
  if (msg.alerts.length) {
    box.innerHTML = msg.alerts.map(a =>
      `<div class="alert ${a.level}"><span class="lvl">${a.level === "CRITICAL" ? "ЗАГРОЗА" : "УВАГА"} · #${a.track_id}</span>` +
      `<span>${esc(a.zone)}</span><span class="meta">${new Date(a.ts * 1000).toLocaleTimeString()} · ${a.speed} м/с · ${esc(a.sensors.map(k => KIND_UA[k] || k).join(", "))}</span></div>`).join("");
    msg.alerts.forEach(a => { const k = a.ts + ":" + a.track_id + ":" + a.level; if (!seenAlerts.has(k)) { seenAlerts.add(k); if (!firstMsg) toast(a); } });
  } else box.innerHTML = '<div class="empty">Тривог немає</div>';
  firstMsg = false;
  document.getElementById("truth-row").hidden = !(cfg && cfg.demo && msg.truth);
}

function renderSensors(list) {
  document.getElementById("sensors").innerHTML = list.map(s =>
    `<div class="sensor ${s.state}"><i></i><span>${esc(s.id)} <span class="st">${esc(KIND_UA[s.label] || s.label)}</span></span>` +
    `<span class="st">${SENSOR_UA[s.state]}${s.state === "LOST" && s.age_s != null ? " · " + Math.round(s.age_s) + " с" : ""}</span></div>`).join("");
  const lost = list.filter(s => s.state === "LOST"), ok = list.filter(s => s.state === "OK").length;
  const badge = document.getElementById("sens");
  badge.textContent = "датчики: " + ok + "/" + list.length;
  badge.className = "badge " + (lost.length ? "off" : ok === list.length ? "live" : "");
  const banner = document.getElementById("degraded");
  banner.hidden = !lost.length;
  if (lost.length) {
    const radarLost = lost.some(s => s.label === "radar");
    banner.textContent = "Втрачено звʼязок: " + lost.map(s => s.id).join(", ") + ". Охорона працює в обмеженому режимі" +
      (radarLost ? ": без радара позиція цілі рахується лише з пеленгів, точність нижча, підтвердження радаром не вимагається." : ".");
  }
}

document.getElementById("tbody").addEventListener("click", e => {
  const tr = e.target.closest("tr"); if (tr) selected = +tr.dataset.id;
});
addEventListener("resize", resize);

async function start() {
  cfg = await (await fetch("/api/config")).json();
  const mode = document.getElementById("mode");
  mode.textContent = cfg.demo ? "ДЕМО (симуляція)" : "бойовий режим"; mode.className = "badge " + (cfg.demo ? "" : "live");
  resize();
  connect();
}
function connect() {
  const ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");
  const conn = document.getElementById("conn");
  ws.onopen = () => { conn.textContent = "на звʼязку"; conn.className = "badge live"; ws.send("hi"); };
  ws.onmessage = e => render(JSON.parse(e.data));
  ws.onclose = () => { conn.textContent = "немає звʼязку"; conn.className = "badge off"; setTimeout(connect, 2000); };
}
start();
</script>
</body>
</html>
