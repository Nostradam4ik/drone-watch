name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Тести (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.15"]   # 3.12 = мінімум із pyproject, 3.15 = версія Docker-образів (docker/*.Dockerfile)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Встановлення пакета з dev-залежностями
        run: pip install -e ".[dev]"
      - name: Лінтер
        run: ruff check .
      - name: Типи
        run: mypy
      - name: Тести
        run: pytest

  browser:
    name: Дашборд у браузері (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Встановлення пакета з Playwright
        run: pip install -e ".[dev,browser]"
      - name: Chromium і системні бібліотеки до нього
        run: python -m playwright install --with-deps chromium
      - name: Браузерні тести (пропуск тут = збій)
        env:
          DW_REQUIRE_BROWSER: "1"
        run: pytest -m browser

  postgres:
    name: Тести з PostgreSQL 16 (HA v2)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Встановлення пакета з драйвером PostgreSQL і Redis
        run: pip install -e ".[dev,postgres,redis]"
      - name: Тести (PostgreSQL-тести тут не пропускаються)
        env:
          DRONEWATCH_TEST_PG_DSN: postgresql://postgres:ci@127.0.0.1:5432/postgres
        run: pytest -p no:cacheprovider

  ha-cluster:
    name: Файли розгортання кластера (HA v2)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: docker compose config, обов'язкові змінні, shellcheck
        run: sh scripts/check_ha_cluster.sh

  docker:
    name: Збірка Docker-образів
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Образ сервісу
        run: docker build -f docker/service.Dockerfile -t dronewatch-service .
      - name: Образ емулятора
        run: docker build -f docker/emulator.Dockerfile -t dronewatch-emulator .
      - name: Сервіс стартує без TLS-змінних лише в fail-closed режимі
        run: |
          set +e
          out=$(docker run --rm dronewatch-service 2>&1); code=$?
          echo "$out"
          [ "$code" -ne 0 ] && echo "$out" | grep -q "HTTPS не налаштовано"

  e2e:
    name: Повний стенд (docker compose)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Підняти стенд (certs, mosquitto, сервіс, емулятор датчиків)
        run: docker compose --profile demo-sensors up --build -d --wait
      - name: Наскрізна перевірка (HTTPS, вхід, MQTT по TLS, датчики, брокер)
        run: bash deploy/e2e-check.sh
      - name: Логи контейнерів (лише при збої)
        if: failure()
        run: docker compose --profile demo-sensors logs --no-color --tail 200
      - name: Зупинити стенд
        if: always()
        run: docker compose --profile demo-sensors down -v
