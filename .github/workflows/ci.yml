name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Тести (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Встановлення пакета з dev-залежностями
        run: pip install -e ".[dev]"
      - name: Лінтер
        run: ruff check .
      - name: Типи
        run: mypy
      - name: Тести
        run: pytest

  docker:
    name: Збірка Docker-образів
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Образ сервісу
        run: docker build -f docker/service.Dockerfile -t dronewatch-service .
      - name: Образ емулятора
        run: docker build -f docker/emulator.Dockerfile -t dronewatch-emulator .
      - name: Сервіс стартує без TLS-змінних лише в fail-closed режимі
        run: |
          set +e
          out=$(docker run --rm dronewatch-service 2>&1); code=$?
          echo "$out"
          [ "$code" -ne 0 ] && echo "$out" | grep -q "HTTPS не налаштовано"

  e2e:
    name: Повний стенд (docker compose)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Підняти стенд (certs, mosquitto, сервіс, емулятор датчиків)
        run: docker compose --profile demo-sensors up --build -d --wait
      - name: Наскрізна перевірка (HTTPS, вхід, MQTT по TLS, датчики, брокер)
        run: bash deploy/e2e-check.sh
      - name: Логи контейнерів (лише при збої)
        if: failure()
        run: docker compose --profile demo-sensors logs --no-color --tail 200
      - name: Зупинити стенд
        if: always()
        run: docker compose --profile demo-sensors down -v
