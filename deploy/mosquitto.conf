# Розробницька конфігурація брокера: без автентифікації й TLS. Для продакшну обовʼязково додайте
# password_file/allow_anonymous false і TLS-слухач (8883), інакше будь-хто в мережі зможе слати події.
# docker-compose.yml публікує порт 1883 лише на 127.0.0.1; не відкривайте його назовні, доки це не зроблено.
listener 1883
allow_anonymous true
persistence false
log_dest stdout
