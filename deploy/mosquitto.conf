# Конфігурація брокера для docker-compose: лише TLS, вхід за логіном і паролем, права за ACL (deploy/mosquitto.acl).
# Користувачі в deploy/mosquitto.passwd: по одному на датчик (ім'я = id датчика, пароль = ключ датчика), dronewatch-service
# і healthcheck. Рядки для файлу видає `python service/keygen.py <id>`; після зміни: docker compose restart mosquitto.
#
# ДЕМО-ПАРОЛІ: хеші в mosquitto.passwd відповідають паролям, що лежать у docker-compose.yml, тобто вони публічні, як і весь
# репозиторій. Для чогось, окрім локальної демонстрації, згенеруйте свої.
#
# TLS. Відкритого слухача (1883) немає зовсім: логіни, паролі й ключі датчиків ходять лише зашифрованим каналом.
# Сертифікат брокера й CA створює сервіс certs (deploy/gen-certs.sh) у Docker-томах при першому запуску; приватних ключів
# у репозиторії немає. Клієнти (сервіс, емулятор) довіряють лише цьому CA й перевіряють ім'я хоста. Для бойового
# розгортання підставте сертифікат від свого CA (ім'я хоста брокера має бути в його SAN), див. README.
# docker-compose.yml публікує порт 8883 лише на 127.0.0.1.
listener 8883
cafile /mosquitto/certs-ca/ca.crt
certfile /mosquitto/certs-server/server.crt
keyfile /mosquitto/certs-server/server.key
# Клієнтський сертифікат не вимагається: клієнта автентифікують логін і пароль. Вимагати його (взаємний TLS) можна
# додатково: require_certificate true і use_identity_as_username true замінили б пароль.
require_certificate false

allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl
# Ім'я клієнта = ім'я користувача, що б клієнт не вказав. Без цього будь-хто з чинним логіном міг би підключитися з чужим
# client_id (наприклад, dronewatch-service) і витіснити того клієнта, бо брокер за специфікацією відключає старого.
use_username_as_clientid true
persistence false
log_dest stdout
