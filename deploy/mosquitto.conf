# Конфігурація брокера для docker-compose: вхід лише за логіном і паролем, права за ACL (deploy/mosquitto.acl).
# Користувачі в deploy/mosquitto.passwd: по одному на датчик (ім'я = id датчика, пароль = ключ датчика), dronewatch-service
# і healthcheck. Рядки для файлу видає `python service/keygen.py <id>`; після зміни: docker compose restart mosquitto.
#
# ДЕМО-ПАРОЛІ: хеші в mosquitto.passwd відповідають паролям, що лежать у docker-compose.yml, тобто вони публічні, як і весь
# репозиторій. Для чогось, окрім локальної демонстрації, згенеруйте свої.
#
# TLS тут немає: логін і пароль, як і ключі, йдуть відкритим текстом. Не відкривайте порт 1883 назовні, доки не додано
# слухач 8883 з сертифікатами (listener 8883 + cafile/certfile/keyfile). docker-compose.yml публікує порт лише на 127.0.0.1.
listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl
# Ім'я клієнта = ім'я користувача, що б клієнт не вказав. Без цього будь-хто з чинним логіном міг би підключитися з чужим
# client_id (наприклад, dronewatch-service) і витіснити того клієнта, бо брокер за специфікацією відключає старого.
use_username_as_clientid true
persistence false
log_dest stdout
