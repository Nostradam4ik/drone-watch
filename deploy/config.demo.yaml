# Демо-режим для docker-compose (профіль sandbox): симулятор рою замість реальних датчиків. Датчики й зони тут не читаються:
# датчики бере симулятор (або ставить admin мишею на карті), зони виводяться з радарів. Для бойового режиму див. deploy/config.yaml.
#
# Без користувачів (як тут) демо ЛИШЕ ДЛЯ ПЕРЕГЛЯДУ: анонім має роль viewer, тож рішення по тривогах, AI, редагування
# розкладки й покриття та журнал дій недоступні (403). Щоб редагувати розкладку, додайте користувача з роллю admin;
# тоді вхід стає обов'язковим, як і в бойовому режимі:
#   dronewatch-keygen --dashboard-user admin --role admin --generate     (друкує пароль і готовий рядок для конфігу)
#   dashboard:
#     users:
#       - {name: admin, password_hash: "scrypt$...", role: admin}
# Ролі: viewer читає; operator ще вирішує тривоги й питає AI; admin ще керує розкладкою, покриттям і читає журнал дій.
mode: demo
scan_dt: 0.5
origin: {lat: 48.8584, lon: 2.2945}
ai:
  enabled: false
