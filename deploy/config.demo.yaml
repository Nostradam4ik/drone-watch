# Демо-режим для docker-compose (профіль sandbox): симулятор рою замість реальних датчиків, без входу в дашборд,
# розстановка датчиків мишею на карті. Датчики й зони тут не читаються: датчики бере симулятор (або ставить оператор),
# зони виводяться з радарів. Для бойового режиму див. deploy/config.yaml.
mode: demo
scan_dt: 0.5
origin: {lat: 48.8584, lon: 2.2945}
ai:
  enabled: false
