# Запуск:  docker compose up --build
# З емулятором датчиків:  docker compose --profile demo-sensors up --build
# З AI-асистентом (Mistral + Qdrant):  MISTRAL_API_KEY=ваш_ключ docker compose --profile demo-sensors --profile ai up --build
# Дашборд: https://localhost:8000     Брокер MQTT: localhost:8883 (лише TLS), топіки dronewatch/events/<sensor_id>
#
# Обидва порти прив'язані до 127.0.0.1 й обслуговують лише TLS: відкритих HTTP/MQTT-слухачів немає. Події датчиків вимагають
# ключ (deploy/config.yaml), брокер закритий логінами й ACL (deploy/mosquitto.*). Сертифікати створює сервіс certs
# (приватних ключів у репозиторії немає), а їхній CA демонстраційний: браузер покаже попередження, доки не додати ca.crt
# до довірених (docker compose cp service:/certs/ca.crt ./ca.crt) або не погодитися з ризиком для цієї демо-сторінки.
# Дашборд закритий входом (демо-користувач demo, пароль нижче в сервісі emulator). Логіни, паролі й ключі ДЕМО-секрети, тож публічні.
# Контейнери бачать один одного по мережі Docker, тож емулятору це не заважає. Щоб приймати датчики з мережі, замініть
# демо-секрети й сертифікати своїми (див. README.md), і лише тоді змініть "127.0.0.1:" на "0.0.0.0:" (або адресу інтерфейсу).
# Свої сертифікати замість демо: див. README.md, розділи про TLS і HTTPS.
services:
  certs:   # одноразово (і при перевипуску) створює CA й сертифікат брокера в томах; приватних ключів у репозиторії немає
    image: alpine/openssl
    entrypoint: ["/bin/sh", "/gen-certs.sh"]
    volumes:
      - ./deploy/gen-certs.sh:/gen-certs.sh:ro
      - certs-ca:/out/ca              # публічний ca.crt: його читають брокер, сервіс і емулятор
      - certs-server:/out/server      # server.crt і server.key: бачить лише брокер
      - certs-http:/out/http          # http.crt і http.key: бачить лише сервіс (HTTPS API, дашборд, WebSocket)
    restart: "no"

  mosquitto:
    image: eclipse-mosquitto:2
    depends_on:
      certs: {condition: service_completed_successfully}
    ports: ["127.0.0.1:8883:8883"]
    # passwd і acl брокер читає лише з правами 0700 і власником mosquitto, інакше «майбутні версії відмовляться їх
    # завантажити». Монтування з Windows/macOS цього не дає, тож монтуємо окремо й копіюємо з потрібними правами при старті.
    # Наслідок: після зміни цих файлів потрібен `docker compose restart mosquitto` (SIGHUP копії не оновить).
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        install -m 0700 -o mosquitto -g mosquitto /run/broker-src/passwd /mosquitto/config/passwd
        install -m 0700 -o mosquitto -g mosquitto /run/broker-src/acl /mosquitto/config/acl
        exec /docker-entrypoint.sh /usr/sbin/mosquitto -c /mosquitto/config/mosquitto.conf
    volumes:
      - ./deploy/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./deploy/mosquitto.passwd:/run/broker-src/passwd:ro
      - ./deploy/mosquitto.acl:/run/broker-src/acl:ro
      - certs-ca:/mosquitto/certs-ca:ro
      - certs-server:/mosquitto/certs-server:ro
    healthcheck:   # окремий користувач, якому ACL дозволяє лише читати час роботи брокера (ДЕМО-пароль)
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -p 8883 --cafile /mosquitto/certs-ca/ca.crt -u healthcheck -P ClE1jaZ9qTQtQYcIhMrPIK2wtBmdfXZT -t '$$SYS/broker/uptime' -C 1 -W 3 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  service:
    build: {context: ., dockerfile: docker/service.Dockerfile}
    ports: ["127.0.0.1:8000:8000"]
    environment:
      CONFIG: /config/config.yaml
      TLS_CERT_FILE: /tls/http.crt       # HTTPS: без цих двох змінних dronewatch.service.serve не стартує (fail-closed)
      TLS_KEY_FILE: /tls/http.key
      TLS_CA_FILE: /certs/ca.crt         # лише для healthcheck: перевіряє сертифікат сервісу так само суворо, як клієнти
      MQTT_HOST: mosquitto
      MQTT_PORT: 8883
      MQTT_CA_CERT: /certs/ca.crt      # з цим CA сервіс перевіряє сертифікат і ім'я хоста брокера
      MQTT_USER: dronewatch-service
      MQTT_PASSWORD: "8DgvEHMEllwyXmx4bD_eWc0NOTz690ll"   # ДЕМО-пароль (хеш у deploy/mosquitto.passwd)
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}   # свій, справжній ключ — ніколи не комітиться. Без нього AI-асистент
                                               # просто вимкнений (ai.enabled у deploy/config.yaml не стартує сервіс примусово)
    volumes:
      - ./deploy/config.yaml:/config/config.yaml:ro
      - ./data/map:/app/data/map:ro   # оффлайн-карта (dronewatch-mapbuild); без файлу дашборд працює без підкладки, без зовнішніх запитів
      - incidents:/data          # журнал тривог переживає перезапуск
      - certs-ca:/certs:ro       # лише публічний ca.crt
      - certs-http:/tls:ro       # сертифікат і ключ сервісу: лише він їх бачить
    depends_on:
      certs: {condition: service_completed_successfully}
      mosquitto: {condition: service_healthy}
    restart: unless-stopped

  sandbox:                        # лише з профілем sandbox: демо-режим із розстановкою датчиків мишею, https://localhost:8001
    profiles: ["sandbox"]
    build: {context: ., dockerfile: docker/service.Dockerfile}
    ports: ["127.0.0.1:8001:8000"]
    environment:
      CONFIG: /config/config.demo.yaml
      TLS_CERT_FILE: /tls/http.crt     # той самий HTTPS, що й у основного сервісу: відкритого HTTP тут теж нема
      TLS_KEY_FILE: /tls/http.key
      TLS_CA_FILE: /certs/ca.crt
      DB_PATH: /tmp/sandbox.db         # журнал демо-сеансу не змішується з журналом основного сервісу
    volumes:
      - ./deploy/config.demo.yaml:/config/config.demo.yaml:ro
      - ./data/map:/app/data/map:ro
      - certs-ca:/certs:ro
      - certs-http:/tls:ro
    depends_on:
      certs: {condition: service_completed_successfully}
    restart: unless-stopped

  qdrant:                         # лише з профілем ai: векторне сховище минулих інцидентів для AI-асистента
    profiles: ["ai"]
    image: qdrant/qdrant:v1.18.0
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped
    # без published-порту: лише сервіс docker-compose мережі звертається до qdrant:6333, ззовні не видно

  emulator:                      # лише з профілем demo-sensors
    profiles: ["demo-sensors"]
    build: {context: ., dockerfile: docker/emulator.Dockerfile}
    volumes:
      - certs-ca:/certs:ro
    environment:   # ДЕМО-ключі, їм відповідають key_sha256 у deploy/config.yaml. Не використовуйте за межами локальної демонстрації
      DRONEWATCH_DASHBOARD_PASSWORD: "fX_-twChwCBeRa5c9ejoW6eF"   # ДЕМО-пароль користувача demo (хеш у deploy/config.yaml)
      DRONEWATCH_KEYS: "radar1=4v5RcNVejeP6hcZ3KgCBQch-CfEPHFq9qlCFkg6aTGI,rf1=CSG2LwD69wOqgdQxZkof6yJHdTKocB7w_UuLJ1E0CAs,ac1=Gm_V2dz2EwmK0VvEQfTdODAmEWoMVixM8SpnlJc6DSY"
    command: ["--url", "https://service:8000", "--ca", "/certs/ca.crt", "--dashboard-user", "demo", "--mqtt", "mosquitto:8883", "--mqtt-ca", "/certs/ca.crt", "--scenario", "swarm", "--count", "8", "--loop"]
    depends_on:
      service: {condition: service_healthy}
    restart: unless-stopped

volumes:
  incidents:
  certs-ca:
  certs-server:
  certs-http:
  qdrant-data:
