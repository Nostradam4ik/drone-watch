<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вхід · Drone Watch</title>
<link rel="stylesheet" href="/static/webfonts/fonts.css">
<style>
  :root {
    --ink: #060a10; --panel: #0b131c; --line: #1c2b38; --text: #dce7ee; --muted: #64808f; --ok: #33e6c2; --crit: #ff3b63;
    --face-label: "Space Grotesk", "Segoe UI", sans-serif; --face-data: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  :focus-visible { outline: 2px solid var(--ok); outline-offset: 1px; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background:
         radial-gradient(ellipse at center, #0a141d 0%, var(--ink) 72%); color: var(--text); font: 13px/1.45 var(--face-data); }
  form { width: min(360px, 92vw); background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 26px 24px; display: grid; gap: 18px; }
  .brand { display: flex; align-items: center; gap: 9px; }
  .blip { position: relative; width: 10px; height: 10px; border-radius: 50%; background: var(--ok); flex: none; }
  .blip::after { content: ""; position: absolute; inset: -5px; border: 1px solid var(--ok); border-radius: 50%;
                 animation: ping 2.4s cubic-bezier(.2,.7,.3,1) infinite; }
  @keyframes ping { 0% { transform: scale(.5); opacity: .9; } 100% { transform: scale(2.1); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .blip::after { animation: none; } }
  h1 { margin: 0; font: 700 17px var(--face-label); letter-spacing: -.01em; }
  p { margin: 0; color: var(--muted); font-size: 12.5px; }
  label { display: grid; gap: 7px; color: var(--muted); font: 500 11px var(--face-label); letter-spacing: .02em; }
  input { background: var(--ink); color: var(--text); border: 1px solid var(--line); border-radius: 3px; padding: 9px 11px; font: 12.5px var(--face-data); }
  button { background: var(--ok); color: #04100d; border: 0; border-radius: 3px; padding: 10px; font: 600 13px var(--face-label); cursor: pointer; }
  button:hover:not(:disabled) { filter: brightness(1.08); }
  button:disabled { opacity: .5; cursor: wait; }
  #err { min-height: 1.4em; color: var(--crit); font-size: 12px; }
</style>
</head>
<body>
<form id="form">
  <div class="brand"><span class="blip"></span><div><h1>DRONE WATCH</h1><p>Вхід для оператора</p></div></div>
  <label>Логін <input name="username" autocomplete="username" required maxlength="64" autofocus></label>
  <label>Пароль <input name="password" type="password" autocomplete="current-password" required maxlength="256"></label>
  <button id="submit">Увійти</button>
  <div id="err" role="alert" aria-live="polite"></div>
</form>
<script>
const form = document.getElementById("form"), err = document.getElementById("err"), submit = document.getElementById("submit");

const MESSAGES = { 401: "Хибний логін або пароль", 415: "Помилка запиту", 403: "Запит відхилено" };

form.addEventListener("submit", async event => {
  event.preventDefault();
  err.textContent = "";
  submit.disabled = true;
  const data = new FormData(form);
  try {
    const response = await fetch("/api/login", {
      method: "POST", credentials: "same-origin", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: data.get("username"), password: data.get("password") }),
    });
    if (response.ok) { location.replace("/"); return; }
    err.textContent = response.status === 429
      ? `Забагато невдалих спроб. Спробуйте за ${response.headers.get("Retry-After") || "кілька"} с`
      : MESSAGES[response.status] || `Помилка сервера (${response.status})`;
    form.elements.password.select();
  } catch {
    err.textContent = "Немає звʼязку із сервісом";
  } finally {
    submit.disabled = false;
  }
});
</script>
</body>
</html>
