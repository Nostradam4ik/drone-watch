<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вхід · Drone Watch</title>
<style>
  :root { --bg: #0b1117; --panel: #111a23; --line: #1f2d3a; --text: #d7e2ea; --muted: #7d92a3; --ok: #3fb5a3; --crit: #ef4b5b; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
         font: 14px/1.4 system-ui, "Segoe UI", sans-serif; }
  form { width: min(360px, 92vw); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 28px 24px; display: grid; gap: 16px; }
  h1 { margin: 0; font-size: 16px; letter-spacing: .04em; }
  p { margin: 0; color: var(--muted); }
  label { display: grid; gap: 6px; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
  input { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; font: inherit; }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--ok); outline-offset: 1px; }
  button { background: var(--ok); color: #04201c; border: 0; border-radius: 6px; padding: 10px; font: inherit; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .55; cursor: wait; }
  #err { min-height: 1.4em; color: var(--crit); }
</style>
</head>
<body>
<form id="form">
  <div><h1>DRONE WATCH</h1><p>Вхід для оператора</p></div>
  <label>Логін <input name="username" autocomplete="username" required maxlength="64" autofocus></label>
  <label>Пароль <input name="password" type="password" autocomplete="current-password" required maxlength="256"></label>
  <button id="submit">Увійти</button>
  <div id="err" role="alert" aria-live="polite"></div>
</form>
<script>
const form = document.getElementById("form"), err = document.getElementById("err"), submit = document.getElementById("submit");

const MESSAGES = { 401: "Хибний логін або пароль", 415: "Помилка запиту", 403: "Запит відхилено" };

form.addEventListener("submit", async event => {
  event.preventDefault();
  err.textContent = "";
  submit.disabled = true;
  const data = new FormData(form);
  try {
    const response = await fetch("/api/login", {
      method: "POST", credentials: "same-origin", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: data.get("username"), password: data.get("password") }),
    });
    if (response.ok) { location.replace("/"); return; }
    err.textContent = response.status === 429
      ? `Забагато невдалих спроб. Спробуйте за ${response.headers.get("Retry-After") || "кілька"} с`
      : MESSAGES[response.status] || `Помилка сервера (${response.status})`;
    form.elements.password.select();
  } catch {
    err.textContent = "Немає звʼязку із сервісом";
  } finally {
    submit.disabled = false;
  }
});
</script>
</body>
</html>
